
<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Bar chart showing five insurance metrics across four income groups</h2>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-bottom:12px">
<div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px">
<div style="font-size:11px;color:var(--color-text-secondary)">countries modelled</div>
<div style="font-size:20px;font-weight:500;color:var(--color-text-primary)">180+</div>
</div>
<div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px">
<div style="font-size:11px;color:var(--color-text-secondary)">key metrics</div>
<div style="font-size:20px;font-weight:500;color:var(--color-text-primary)">5</div>
</div>
<div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px">
<div style="font-size:11px;color:var(--color-text-secondary)">income groups</div>
<div style="font-size:20px;font-weight:500;color:var(--color-text-primary)">4</div>
</div>
<div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px">
<div style="font-size:11px;color:var(--color-text-secondary)">data sources</div>
<div style="font-size:20px;font-weight:500;color:var(--color-text-primary)">2</div>
</div>
</div>

<div style="display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap;font-size:12px;color:var(--color-text-secondary)">
<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#1D9E75"></span>Life ins. share</span>
<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#378ADD"></span>Market share</span>
<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#7F77DD"></span>Penetration</span>
<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#D85A30"></span>Reinsurance ratio</span>
<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#BA7517"></span>Retention ratio</span>
</div>

<div style="position:relative;width:100%;height:280px">
<canvas id="metricsChart" role="img" aria-label="Grouped bar chart showing insurance metrics across four income groups: Low, Lower-middle, Upper-middle, High">Insurance metrics by income group</canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const groups = ['Low income','Lower-middle','Upper-middle','High income'];
new Chart(document.getElementById('metricsChart'), {
  type: 'bar',
  data: {
    labels: groups,
    datasets: [
      { label: 'Life ins. share', data: [12,22,34,52], backgroundColor: '#1D9E75', borderRadius: 3 },
      { label: 'Market share', data: [2,8,18,58], backgroundColor: '#378ADD', borderRadius: 3 },
      { label: 'Penetration', data: [1.2,2.1,3.5,7.8], backgroundColor: '#7F77DD', borderRadius: 3 },
      { label: 'Reinsurance ratio', data: [38,28,22,14], backgroundColor: '#D85A30', borderRadius: 3 },
      { label: 'Retention ratio', data: [62,72,78,86], backgroundColor: '#BA7517', borderRadius: 3 }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y + '%' } } },
    scales: {
      x: { ticks: { font: { size: 12 }, color: '#888780' }, grid: { display: false } },
      y: { ticks: { font: { size: 11 }, color: '#888780', callback: v => v + '%' }, grid: { color: 'rgba(136,135,128,0.15)' }, border: { display: false } }
    }
  }
});
</script>
